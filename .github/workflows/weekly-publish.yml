name: Weekly Publish

on:
  schedule:
    # Every Monday at 03:00 UTC (07:00 Dubai time)
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js static export)
        run: npm run build

      # Cloudflare Pages is connected to main and rebuilds on every push.
      # Update a tracked marker so scheduled articles are included in a fresh export.
      - name: Trigger Cloudflare Pages rebuild
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-weekly-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-weekly-publish
          git commit -m 'chore: rebuild scheduled journal articles'
          git push origin HEAD:main
